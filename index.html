<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>EkSkool</title>
    <link rel="icon" type="image/x-icon" href="/demos/favicon.ico" />
    <script>
      (function () {
        var root = document.documentElement;
        var keys = ["theme", "theme-base", "theme-font", "theme-primary", "theme-radius"];
        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          var value = window.localStorage.getItem("tabler-" + key);
          if (value) {
            root.setAttribute("data-bs-" + key, value);
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="/demos/assets/index-j0Sh__lL.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/assets/index-F018QpXK.css">

  <body class="layout-fluid">
    <div id="root"></div>
  </body>
</html>
