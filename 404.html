<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/demo/, "");
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        var target = "/demo/?p=" + encodeURIComponent(path + search + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
